<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Course Pierian Training</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="faq.html">FAQ</a>
      <a href="contacto.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-card">
      <h1>Contact Us</h1>
      <p class="subtitle">Have a question about a course or your account? Send us a message.</p>

      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="topic">Topic</label>
          <select id="topic" name="topic">
            <option value="courses">Course enrollment</option>
            <option value="certificate">Certificates</option>
            <option value="support">Technical support</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="How can we help?" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Course Pierian Training</p>
  </footer>
</body>
</html>
